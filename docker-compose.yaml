# Local release candidate. TLS termination and rollout require separate approval.
services:
  keyoxide:
    build: .
    image: monero-love-keyoxide:simplex-rc1
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    environment:
      NODE_ENV: production
      ENABLE_PROXY_MODULE: "false"
      ENABLE_SERVER_VERIFICATION: "false"
