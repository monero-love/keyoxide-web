when:
  branch: dev
  event: push
steps:
  build-dev-container:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: https://codeberg.org/v2
      username:
        from_secret: codeberg_username
      password:
        from_secret: codeberg_password
      repo: codeberg.org/keyoxide/keyoxide-web
      tag: dev
      build_args_from_env:
        - CI_COMMIT_SHA
        - CI_COMMIT_BRANCH

depends_on:
  - test