# Only validation. This workflow never publishes a container or runs live chat tests.
when:
  event: [push, pull_request, manual]
steps:
  release-checks:
    image: node:22.23.5-bookworm-slim@sha256:e9f565d32859f0cbfb52125eafe8be39390f24dac302dc3cdf566e8ba3ab21ee
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git gnupg
      - npm ci --ignore-scripts
      - npm ci --ignore-scripts --prefix experiments/simplex-verifier
      - npx playwright install --with-deps chromium
      - npm run check:release
